name: Deploy to Staging

on:
    pull_request:
        types: [opened, synchronize, reopened]
        branches: [main]

env:
    FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

jobs:
    deploy-staging:
        needs: []
        runs-on: ubuntu-latest
        outputs:
            staging-url: ${{ steps.deploy.outputs.staging-url }}
        steps:
            - uses: actions/checkout@v4

            - uses: superfly/flyctl-actions/setup-flyctl@master

            - name: Deploy to staging
              id: deploy
              run: |
                  flyctl deploy --config stage/fly.toml --app gallformers-staging

                  # Install Python dependencies for refresh script
                  flyctl ssh console --app gallformers-staging --command "cd /usr/src/app && pip install -r scripts/requirements.txt"

                  # Refresh staging database from latest production backup
                  flyctl ssh console --app gallformers-staging --command "cd /usr/src/app && python scripts/main.py refresh-staging-from-latest-backup"

                  STAGING_URL="https://gallformers-staging.fly.dev"
                  echo "staging-url=$STAGING_URL" >> $GITHUB_OUTPUT

                  # Add comment to PR with staging URL
                  gh pr comment ${{ github.event.number }} --body "🚀 **Staging deployment ready!**

                  **Staging URL**: $STAGING_URL
                  **Commit**: ${{ github.event.pull_request.head.sha }}
                  **Database**: Refreshed with latest production data

                  Test your changes and then promote to production when ready."
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
