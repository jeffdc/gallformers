name: CI

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'assets/**'
      - 'priv/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'Dockerfile'
      - 'Dockerfile.preview'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'assets/**'
      - 'priv/**'
      - 'test/**'
      - 'mix.exs'
      - 'mix.lock'
      - 'flake.nix'
      - 'flake.lock'
      - 'Dockerfile'
      - 'Dockerfile.preview'
      - 'scripts/**'
      - '.github/workflows/ci.yml'
  workflow_dispatch:

concurrency:
  group: ci-postgres-${{ github.ref }}
  cancel-in-progress: true

# Toolchain comes from the flake's dev shell (flake.nix), the same one used locally.
# Steps run through `nix develop`; the shell is pre-built in its own step so a broken
# shell fails clearly and doesn't skew step timings.

jobs:
  phoenix:
    name: Phoenix
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gallformers_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      USER: postgres
      # Point the dev shell's Postgres settings at the service container.
      GALLFORMERS_PG_HOST: localhost
      GALLFORMERS_PG_PORT: '5432'

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Check Dockerfiles match the flake toolchain
        run: scripts/check-toolchain

      - name: Install dependencies
        run: mix deps.get

      - name: Setup test database
        run: |
          mix ecto.create --quiet
          mix ecto.migrate --quiet
          psql -U postgres -d gallformers_test -f priv/repo/test_seeds.sql --quiet
          createdb -U postgres wcvp_test
          psql -U postgres -d wcvp_test -f priv/repo/wcvp_test_setup.sql --quiet
          mix gallformers.catalog.migrate --curated test/support/fixtures/catalog_migration --no-s3

      - name: Run precommit checks (format, compile, credo, migrations, tests, exclusion check)
        run: mix precommit

  assets:
    name: Assets
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'

    steps:
      - uses: actions/checkout@v5

      - uses: cachix/install-nix-action@v31

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v5
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Install npm dependencies
        run: npm ci --prefix assets

      - name: Run JS tests
        run: npm test --prefix assets

      - name: Build assets
        run: mix assets.deploy

  api-version-check:
    name: API Version Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check if API files changed without version bump
        run: |
          BASE_SHA=${{ github.event.pull_request.base.sha }}
          HEAD_SHA=${{ github.event.pull_request.head.sha }}

          # Check if any API controller files changed
          API_CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA -- 'lib/gallformers_web/controllers/api/**' | wc -l)

          # Check if API_VERSION changed
          VERSION_CHANGED=$(git diff --name-only $BASE_SHA $HEAD_SHA -- 'API_VERSION' | wc -l)

          if [ "$API_CHANGED" -gt 0 ] && [ "$VERSION_CHANGED" -eq 0 ]; then
            echo "::error::API files changed but API_VERSION was not updated!"
            echo ""
            echo "Changed API files:"
            git diff --name-only $BASE_SHA $HEAD_SHA -- 'lib/gallformers_web/controllers/api/**'
            echo ""
            echo "When modifying the REST API, you must bump the version in API_VERSION"
            echo "Current version: $(cat API_VERSION)"
            exit 1
          fi

          if [ "$API_CHANGED" -gt 0 ]; then
            echo "API files changed and API_VERSION was updated. Good!"
          else
            echo "No API files changed. Skipping version check."
          fi
