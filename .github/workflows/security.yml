name: Security Audit

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'config/**'
      - 'mix.exs'
      - 'mix.lock'
      - '.github/workflows/security.yml'
  pull_request:
    branches: [main, taxogall]
  schedule:
    # Run weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

# The GITHUB_TOKEN only reads the repository; nothing here writes to GitHub.
permissions:
  contents: read

jobs:
  # What the pull request changes (heartwood's actions/changes, with
  # dev/guardrails/config.sh): one that changes only prose skips the jobs
  # below. They also run if this job fails, so a broken classifier never
  # skips them; a push or a schedule counts as changing everything. The
  # action's tag moves with @heartwood_tag in mix.exs.
  changes:
    name: Security changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: changes
        uses: jeffdc/heartwood/guardrails/actions/changes@v0.2.3

  elixir-audit:
    name: Elixir Security Audit
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code == 'true') }}

    # Toolchain from the flake's dev shell (flake.nix), same as CI and local dev.
    # Not yet a required check: it fails until Earmark (retired) is replaced and the
    # vulnerable deps are upgraded; then the ruleset on main requires it.
    defaults:
      run:
        shell: 'nix develop -c bash -e {0}'
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v32

      - name: Build dev shell
        shell: bash
        run: nix build --no-link .#devShells.x86_64-linux.default

      - name: Restore dependencies cache
        uses: actions/cache@v6
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-${{ hashFiles('mix.lock') }}
          restore-keys: ${{ runner.os }}-mix-${{ hashFiles('flake.lock') }}-

      - name: Install dependencies
        run: mix deps.get

      - name: Compile
        run: mix compile

      - name: Check retired Hex packages
        run: mix hex.audit

      - name: Audit Mix dependencies for vulnerabilities
        run: mix deps.audit

      - name: Run Sobelow security scanner
        run: mix sobelow --exit high --private
