version: 2
# Until cutover, version updates go to taxogall, where the new back-end is
# built; main takes only hotfixes (Jeff, 2026-11-26). Drop target-branch at
# cutover.
updates:
  - package-ecosystem: mix
    directory: /
    target-branch: taxogall
    schedule:
      interval: weekly
    groups:
      mix:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: /assets
    target-branch: taxogall
    schedule:
      interval: weekly
    groups:
      npm:
        patterns:
          - "*"
  - package-ecosystem: github-actions
    directory: /
    target-branch: taxogall
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns:
          - "*"
