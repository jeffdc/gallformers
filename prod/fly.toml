
app = 'gallformers-prod'
primary_region = 'iad'

[build]
dockerfile = 'Dockerfile.fly'

[env]
NEXT_TELEMETRY_DISABLED = '1'
NODE_ENV = 'production'

[http_service]
internal_port = 3000
force_https = true
auto_stop_machines = 'stop'
auto_start_machines = true
min_machines_running = 1
processes = ['app']

[[http_service.checks]]
interval = "10s"
grace_period = "5s"
method = "get"
path = "/api/health"
timeout = "3s"

[http_service.checks.headers]
User-Agent = "fly-health-check"

[[mounts]]
source = "gallformers_data"
destination = "/data"

[[vm]]
cpu_kind = 'shared'
cpus = 1
memory_mb = 1024
