integration: taxogall
release: main
remote: origin
done_checks:
    - make done-checks
layers:
    data:
        - priv/repo/**
        - priv/catalog_migration/**
    docs:
        - docs/**
        - runbooks/**
        - '*.md'
    domain:
        - lib/gallformers/**
        - lib/mix/**
        - lib/*.ex
    import:
        - priv/import/**
        - services/import-producer/**
    tests:
        - test/**
    tooling:
        - dev/githooks/**
        - dev/guardrails/**
        - dev/credo/**
        - .credo.exs
        - Makefile
        - mix.exs
        - mix.lock
        - .github/**
        - flake.*
        - Dockerfile*
        - fly*.toml
        - infra/**
        - scripts/**
    ui:
        - lib/gallformers_web/**
        - assets/**
        - dev/gallformers_web/**
